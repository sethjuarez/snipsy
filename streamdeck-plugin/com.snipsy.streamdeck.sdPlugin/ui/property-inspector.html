<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snipsy</title>
    <script type="module" src="./property-inspector.mjs"></script>
    <style>
      body {
        color: #d8d8d8;
        background: transparent;
        font: 13px system-ui, sans-serif;
        margin: 0;
        padding: 8px 0;
      }
      .sdpi-item {
        align-items: center;
        display: flex;
        gap: 10px;
        min-height: 32px;
        padding: 4px 0;
      }
      .sdpi-item-label {
        color: #d8d8d8;
        flex: 0 0 96px;
        font-weight: 600;
        text-align: right;
      }
      .sdpi-item-value {
        flex: 1;
        min-width: 0;
      }
      select {
        box-sizing: border-box;
        width: 100%;
      }
      .status {
        color: #a8a8a8;
        font-size: 12px;
        line-height: 1.35;
        margin: 6px 0 0 106px;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Snippet</div>
      <div class="sdpi-item-value">
        <select id="buttonSelect">
          <option value="">Loading snippets from Snipsy...</option>
        </select>
      </div>
    </div>
    <div id="status" class="status"></div>
  </body>
</html>
