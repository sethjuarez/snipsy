<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snipsy</title>
    <script type="module" src="./property-inspector.mjs"></script>
    <style>
      body {
        color: var(--sd-text-color, #d8d8d8);
        background: transparent;
        font: 13px system-ui, sans-serif;
        margin: 0;
        padding: 8px 0;
      }
      .sdpi-item {
        align-items: center;
        display: flex;
        gap: 10px;
        min-height: 32px;
        padding: 4px 0;
      }
      .sdpi-item-label {
        color: var(--sd-text-color, #d8d8d8);
        flex: 0 0 96px;
        font-weight: 600;
        text-align: right;
      }
      .sdpi-item-value {
        flex: 1;
        min-width: 0;
      }
      .select-wrap {
        position: relative;
      }
      .select-wrap::after {
        border-bottom: 1.5px solid var(--sd-text-muted, #a8a8a8);
        border-right: 1.5px solid var(--sd-text-muted, #a8a8a8);
        content: "";
        height: 7px;
        pointer-events: none;
        position: absolute;
        right: 11px;
        top: 50%;
        transform: translateY(-65%) rotate(45deg);
        width: 7px;
      }
      select.snipsy-select {
        appearance: none;
        background: var(--sd-control-background, #3b3b3b);
        border: 1px solid var(--sd-control-border, #4a4a4a);
        border-radius: 4px;
        box-sizing: border-box;
        color: var(--sd-text-color, #d8d8d8);
        font: inherit;
        min-height: 28px;
        outline: none;
        padding: 4px 30px 4px 8px;
        width: 100%;
      }
      select.snipsy-select:hover {
        background: var(--sd-control-hover-background, #464646);
      }
      select.snipsy-select:focus {
        border-color: var(--sd-highlight-color, #0078ff);
        box-shadow: 0 0 0 1px var(--sd-highlight-color, #0078ff);
      }
      select.snipsy-select:disabled {
        color: var(--sd-disabled-text-color, #787878);
        opacity: 1;
      }
      select.snipsy-select option {
        background: var(--sd-control-background, #3b3b3b);
        color: var(--sd-text-color, #d8d8d8);
      }
      .status {
        color: var(--sd-text-muted, #a8a8a8);
        font-size: 12px;
        line-height: 1.35;
        margin: 6px 0 0 106px;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Snippet</div>
      <div class="sdpi-item-value">
        <div class="select-wrap">
          <select id="buttonSelect" class="snipsy-select">
            <option value="">Loading snippets from Snipsy...</option>
          </select>
        </div>
      </div>
    </div>
    <div id="status" class="status"></div>
  </body>
</html>
