<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snipsy Icon Options</title>
<style>
  body { background: #1a1a2e; color: #eee; font-family: system-ui, sans-serif; padding: 40px; }
  h1 { text-align: center; color: #7c5cbf; margin-bottom: 8px; }
  p.sub { text-align: center; color: #888; margin-bottom: 40px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; max-width: 960px; margin: 0 auto; }
  .card { background: #16213e; border-radius: 12px; padding: 24px; text-align: center; border: 1px solid #2a2a4a; }
  .card:hover { border-color: #7c5cbf; }
  .card h3 { font-size: 14px; margin: 16px 0 4px; color: #c4b5fd; }
  .card p { font-size: 12px; color: #777; margin: 0; }
  .sizes { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #2a2a4a; }
</style>
</head>
<body>
<h1>Snipsy — Ultra Minimal</h1>
<p class="sub">One shape each. White on purple. Reads at 16px on a hat.</p>
<div class="grid">

  <!-- 1. Minimal scissors — just the X with finger loops -->
  <div class="card">
    <svg width="80" height="80" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#7c5cbf"/>
      <line x1="18" y1="18" x2="46" y2="46" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <line x1="46" y1="18" x2="18" y2="46" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="18" cy="46" r="5" stroke="#fff" stroke-width="3" fill="#7c5cbf"/>
      <circle cx="46" cy="46" r="5" stroke="#fff" stroke-width="3" fill="#7c5cbf"/>
    </svg>
    <h3>1 — Snip</h3>
    <p>Minimal scissors</p>
    <div class="sizes">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><line x1="18" y1="18" x2="46" y2="46" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line x1="46" y1="18" x2="18" y2="46" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="18" cy="46" r="5" stroke="#fff" stroke-width="3" fill="#7c5cbf"/><circle cx="46" cy="46" r="5" stroke="#fff" stroke-width="3" fill="#7c5cbf"/></svg>
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><line x1="18" y1="18" x2="46" y2="46" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line x1="46" y1="18" x2="18" y2="46" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="18" cy="46" r="5" stroke="#fff" stroke-width="3" fill="#7c5cbf"/><circle cx="46" cy="46" r="5" stroke="#fff" stroke-width="3" fill="#7c5cbf"/></svg>
      <svg width="16" height="16" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><line x1="18" y1="18" x2="46" y2="46" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line x1="46" y1="18" x2="18" y2="46" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="18" cy="46" r="5" stroke="#fff" stroke-width="3" fill="#7c5cbf"/><circle cx="46" cy="46" r="5" stroke="#fff" stroke-width="3" fill="#7c5cbf"/></svg>
    </div>
  </div>

  <!-- 2. Bold S -->
  <div class="card">
    <svg width="80" height="80" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#7c5cbf"/>
      <path d="M40 18 C32 12, 20 14, 20 22 C20 30, 44 30, 44 40 C44 48, 32 52, 24 46" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
    </svg>
    <h3>2 — S</h3>
    <p>The letter</p>
    <div class="sizes">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><path d="M40 18 C32 12, 20 14, 20 22 C20 30, 44 30, 44 40 C44 48, 32 52, 24 46" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/></svg>
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><path d="M40 18 C32 12, 20 14, 20 22 C20 30, 44 30, 44 40 C44 48, 32 52, 24 46" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/></svg>
      <svg width="16" height="16" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><path d="M40 18 C32 12, 20 14, 20 22 C20 30, 44 30, 44 40 C44 48, 32 52, 24 46" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/></svg>
    </div>
  </div>

  <!-- 3. Lightning bolt -->
  <div class="card">
    <svg width="80" height="80" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#7c5cbf"/>
      <polygon points="36,10 18,36 30,36 28,54 46,28 34,28" fill="#fff"/>
    </svg>
    <h3>3 — Bolt</h3>
    <p>Instant</p>
    <div class="sizes">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polygon points="36,10 18,36 30,36 28,54 46,28 34,28" fill="#fff"/></svg>
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polygon points="36,10 18,36 30,36 28,54 46,28 34,28" fill="#fff"/></svg>
      <svg width="16" height="16" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polygon points="36,10 18,36 30,36 28,54 46,28 34,28" fill="#fff"/></svg>
    </div>
  </div>

  <!-- 4. Play triangle -->
  <div class="card">
    <svg width="80" height="80" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#7c5cbf"/>
      <polygon points="24,16 24,48 48,32" fill="#fff"/>
    </svg>
    <h3>4 — Play</h3>
    <p>Go</p>
    <div class="sizes">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polygon points="24,16 24,48 48,32" fill="#fff"/></svg>
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polygon points="24,16 24,48 48,32" fill="#fff"/></svg>
      <svg width="16" height="16" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polygon points="24,16 24,48 48,32" fill="#fff"/></svg>
    </div>
  </div>

  <!-- 5. Angle brackets -->
  <div class="card">
    <svg width="80" height="80" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#7c5cbf"/>
      <polyline points="24,16 14,32 24,48" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="40,16 50,32 40,48" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h3>5 — Brackets</h3>
    <p>Code</p>
    <div class="sizes">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polyline points="24,16 14,32 24,48" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="40,16 50,32 40,48" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polyline points="24,16 14,32 24,48" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="40,16 50,32 40,48" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg width="16" height="16" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polyline points="24,16 14,32 24,48" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="40,16 50,32 40,48" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <!-- 6. Dot (record) -->
  <div class="card">
    <svg width="80" height="80" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#7c5cbf"/>
      <circle cx="32" cy="32" r="14" fill="#fff"/>
    </svg>
    <h3>6 — Dot</h3>
    <p>Recording</p>
    <div class="sizes">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><circle cx="32" cy="32" r="14" fill="#fff"/></svg>
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><circle cx="32" cy="32" r="14" fill="#fff"/></svg>
      <svg width="16" height="16" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><circle cx="32" cy="32" r="14" fill="#fff"/></svg>
    </div>
  </div>

  <!-- 7. Asterisk / spark -->
  <div class="card">
    <svg width="80" height="80" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#7c5cbf"/>
      <line x1="32" y1="12" x2="32" y2="52" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <line x1="15" y1="22" x2="49" y2="42" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <line x1="49" y1="22" x2="15" y2="42" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <h3>7 — Spark</h3>
    <p>Magic</p>
    <div class="sizes">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><line x1="32" y1="12" x2="32" y2="52" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line x1="15" y1="22" x2="49" y2="42" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line x1="49" y1="22" x2="15" y2="42" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><line x1="32" y1="12" x2="32" y2="52" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line x1="15" y1="22" x2="49" y2="42" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line x1="49" y1="22" x2="15" y2="42" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
      <svg width="16" height="16" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><line x1="32" y1="12" x2="32" y2="52" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line x1="15" y1="22" x2="49" y2="42" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line x1="49" y1="22" x2="15" y2="42" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- 8. Cursor arrow -->
  <div class="card">
    <svg width="80" height="80" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#7c5cbf"/>
      <polygon points="20,12 20,48 30,40 40,52 46,48 36,36 48,34" fill="#fff"/>
    </svg>
    <h3>8 — Cursor</h3>
    <p>Click</p>
    <div class="sizes">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polygon points="20,12 20,48 30,40 40,52 46,48 36,36 48,34" fill="#fff"/></svg>
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polygon points="20,12 20,48 30,40 40,52 46,48 36,36 48,34" fill="#fff"/></svg>
      <svg width="16" height="16" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#7c5cbf"/><polygon points="20,12 20,48 30,40 40,52 46,48 36,36 48,34" fill="#fff"/></svg>
    </div>
  </div>

</div>
<p class="sub" style="margin-top: 40px;">White on purple. One shape. Reads at any size.</p>
</body>
</html>
