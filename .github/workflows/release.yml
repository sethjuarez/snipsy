name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created != 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Stream Deck version in release PR
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BRANCH=""
          for attempt in 1 2 3 4 5 6; do
            PR_BRANCH="$(gh pr list --state open --label "autorelease: pending" --json headRefName --jq '.[0].headRefName // ""')"
            if [ -n "$PR_BRANCH" ]; then
              break
            fi
            echo "Pending release PR not visible yet; retrying (${attempt}/6)."
            sleep 10
          done

          if [ -z "$PR_BRANCH" ]; then
            echo "No pending release PR found."
            exit 0
          fi

          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"
          node scripts/sync-streamdeck-version.mjs

          if git diff --quiet -- streamdeck-plugin/com.snipsy.streamdeck.sdPlugin/manifest.json; then
            echo "Stream Deck manifest version is already synced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamdeck-plugin/com.snipsy.streamdeck.sdPlugin/manifest.json
          git commit -m "chore(streamdeck): sync plugin version"
          git push origin "HEAD:$PR_BRANCH"

  trigger-builds:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger build workflows
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.release-please.outputs.tag_name }}';
            const workflows = ['release-win-linux.yml', 'release-macos.yml'];
            for (const workflow of workflows) {
              console.log(`Dispatching ${workflow} for tag ${tag}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow,
                ref: 'main',
                inputs: { tag: tag }
              });
            }
