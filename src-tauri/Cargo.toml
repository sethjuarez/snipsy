[package]
name = "snipsy"
version = "0.24.0"
edition = "2021"
description = "A demoer's power tool for managing text and video snippets"

[lib]
name = "snipsy_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
enigo = { version = "0.3", features = ["serde"] }
arboard = "3"
xcap = "0.8"
image = "0.25"
base64 = "0.22"
fastrand = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tauri plugins
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-auditaur = "0.4.8"

active-win-pos-rs = "0.8"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
